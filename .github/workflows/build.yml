name: CPU build and tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openmp: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMC_ENABLE_OPENMP=${{ matrix.openmp }} -DMC_ENABLE_CUDA=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  windows-instrumentation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Recorder smoke, instrumentation and retained engine tests
        shell: powershell
        run: ./scripts/run-cpu-benchmark.ps1 -Mode smoke -OutputDirectory results/ci-cpu-smoke
