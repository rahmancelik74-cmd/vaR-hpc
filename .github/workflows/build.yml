name: CPU build and tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openmp: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Public reproduction environment and source
        run: |
          git rev-parse HEAD
          git rev-parse --is-shallow-repository
          git status --short
          uname -srm
          cat /etc/os-release
          printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          git --version
          python3 --version
          cmake --version
          ctest --version
          c++ --version
      - name: Offline convergence provenance tests (no simulations)
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Public historical evidence integrity (full Git history, no local archives)
        run: python3 -B scripts/check-reproducibility.py
      - name: Selected DRAM counter evidence (no GPU execution)
        run: python3 -B evidence/v030-dram-baseline-20261020/verify.py
      - name: Portfolio campaign public arithmetic and figures (no campaign execution)
        run: python3 -B scripts/verify_portfolio_campaign.py
      - name: Portfolio precision follow-up arithmetic and integrity (no reference generation)
        run: python3 -B scripts/verify_portfolio_precision.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMC_ENABLE_OPENMP=${{ matrix.openmp }} -DMC_ENABLE_CUDA=OFF -DMC_BUILD_CPU_TOOLS=OFF -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  windows-instrumentation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Recorder smoke, instrumentation and retained engine tests
        shell: powershell
        run: ./scripts/run-cpu-benchmark.ps1 -Mode smoke -OutputDirectory results/ci-cpu-smoke
  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build CPU portable ZIP and audit native dependencies
        run: python -B scripts/build_portable.py --output results/portable-ci
      - name: Test extracted package in paths with spaces and non-ASCII characters
        shell: powershell
        run: |
          $zip = Get-ChildItem results/portable-ci -Filter '*.zip' | Select-Object -ExpandProperty FullName
          python -B scripts/check_portable.py $zip --output results/portable-ci-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retained CPU application and engine regressions
        run: ctest --test-dir build-local-app --output-on-failure
      - name: Publish portable CPU artifact (no Release or tag)
        uses: actions/upload-artifact@v4
        with:
          name: mc-lab-portable-cpu-${{ github.sha }}
          path: results/portable-ci/Monte Carlo Lab CPU/
          retention-days: 30
          if-no-files-found: error
